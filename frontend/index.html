<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenShelf — Your Digital Library Network. Discover, borrow, and manage books across a network of community libraries." />
    <title>OpenShelf — Library Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function() {
        var path = window.location.pathname;
        var match = path.match(/^\/([^\/]+)/);
        var repoName = match ? '/' + match[1] : '';
        if (repoName && path.length > repoName.length && path !== repoName + '/') {
          var subPath = path.substring(repoName.length);
          if (subPath && !subPath.startsWith('/assets/') && !subPath.includes('.')) {
            window.location.replace(repoName + '/#' + subPath + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
